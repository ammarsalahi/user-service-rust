services:
  surrealdb:
    # Must stay on 2.x: the `surrealdb` crate is locked to 2.7.0 and cannot talk to
    # a 3.x server over WebSocket ("Server sent no subprotocol").
    image: surrealdb/surrealdb:v2.7.0
    command:
      - start
      - --log
      - info
      - --user
      - root
      - --pass
      - root
      - --bind
      - 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - surrealdb_data:/var/lib/surrealdb
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      RUST_LOG: info
      HOST: "0.0.0.0"
      PORT: "3000"
      SURREAL_URL: "ws://surrealdb:8000"
      SURREAL_USER: root
      SURREAL_PASSWORD: root
      JWT_SECRET: "change-this-to-a-long-random-secret"
    depends_on:
      surrealdb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  surrealdb_data:
