[package]
name = "user-service-rust"
version = "0.1.0"
edition = "2024"



[dependencies]
axum = "0.8.9"
tokio = {version="1.54.1",features=["full"]}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
surrealdb = { version = "2", features = ["protocol-ws"] }
rand = "0.8"
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10", features = ["axum"] }
